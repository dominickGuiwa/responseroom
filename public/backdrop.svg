<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Decorative backdrop: a globe, an operator's headset and broadcast arcs, drawn as thin steel-cyan line art at low
       opacity so it reads as texture behind the cards, never as content. -->
  <g fill="none" stroke="#1F6E8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <!-- Globe, upper right -->
    <circle cx="1270" cy="250" r="250"/>
    <ellipse cx="1270" cy="250" rx="85" ry="250"/>
    <ellipse cx="1270" cy="250" rx="170" ry="250"/>
    <path d="M1270 0V500"/>
    <path d="M1020 250H1520"/>
    <path d="M1051 130H1489M1051 370H1489"/>
    <path d="M1120 50H1420M1120 450H1420"/>
    <!-- Broadcast arcs, upper left -->
    <path d="M300 120A180 180 0 0 1 120 300"/>
    <path d="M380 120A260 260 0 0 1 120 380"/>
    <path d="M460 120A340 340 0 0 1 120 460"/>
    <circle cx="120" cy="120" r="10" fill="#1F6E8C" stroke="none"/>
    <!-- Operator headset, lower left -->
    <path d="M180 760A150 150 0 0 1 480 760"/>
    <rect x="165" y="745" width="34" height="95" rx="10"/>
    <rect x="461" y="745" width="34" height="95" rx="10"/>
    <path d="M478 838Q470 905 400 905"/>
    <circle cx="392" cy="905" r="8"/>
    <!-- Route dashes, lower right -->
    <path d="M980 900C1080 820 1180 860 1280 780S1480 720 1560 640" stroke-dasharray="14 18"/>
    <circle cx="980" cy="900" r="7" fill="#1F6E8C" stroke="none"/>
    <circle cx="1560" cy="640" r="7"/>
  </g>
</svg>
